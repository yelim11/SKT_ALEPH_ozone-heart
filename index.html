<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#3b183f" />
  <title>오존 하트 체크</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell" aria-label="오존 하트 체크 애플리케이션">
    <section class="design-stage" id="stage">
      <img class="design-bg" src="assets/design.png" alt="슈가슈가룬 감성의 오존 하트 체크 화면" draggable="false" />

      <div class="temp-control" aria-label="기온 입력">
        <input id="temperature" type="number" min="-30" max="60" step="0.1" value="28" inputmode="decimal" aria-label="오늘의 기온" />
        <span>°C</span>
      </div>

      <button id="checkBtn" class="hotspot check-hotspot" aria-label="오존 하트 체크하기"></button>
      <div id="vHeart" class="v-heart" aria-hidden="true">♥</div>
      <img id="duke" class="duke" src="assets/duke.png" alt="듀크" draggable="false" />

      <section class="bgm-panel" aria-label="BGM 설정">
        <button id="bgmToggle" type="button" class="bgm-pill">♫ BGM</button>
        <label class="bgm-upload">
          <span>음악 넣기</span>
          <input id="bgmFile" type="file" accept="audio/*" />
        </label>
        <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="BGM 음량" />
        <audio id="bgm" loop preload="auto">
          <source src="assets/bgm.mp3" type="audio/mpeg" />
        </audio>
      </section>

      <div id="flash" class="flash" aria-hidden="true"></div>
      <div id="sparkles" class="sparkles" aria-hidden="true"></div>

      <section id="resultCard" class="result-card" aria-live="polite" aria-hidden="true">
        <button id="closeResult" class="close-result" type="button" aria-label="결과 닫기">×</button>
        <div class="result-kicker">오늘의 오존 하트는…</div>
        <div id="resultHeart" class="result-heart" aria-hidden="true">♥</div>
        <div id="resultName" class="result-name">주의</div>
        <p id="resultText" class="result-text"></p>
        <p class="result-note">※ 기온과 오존의 관계를 설명하기 위한 연구 기반 시각화입니다. 실제 외출 판단은 현재 대기질 측정값과 함께 확인하세요.</p>
      </section>

      <button id="chocolaCard" class="chocola-card" type="button" aria-label="쇼콜라 이미지 크게 보기">
        <img src="assets/chocola-v.png" alt="브이 포즈의 쇼콜라" />
      </button>
    </section>
  </main>

  <dialog id="chocolaDialog" class="chocola-dialog">
    <button id="closeChocola" class="dialog-close" type="button">×</button>
    <img src="assets/chocola-v.png" alt="브이 포즈의 쇼콜라" />
  </dialog>

  <script src="app.js"></script>
</body>
</html>
