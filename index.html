<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#35143d" />
  <title>오존 하트 체크</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="bgm" aria-label="BGM 설정">
      <button id="bgmToggle" type="button">♫ BGM</button>
      <label>음악 넣기<input id="bgmFile" type="file" accept="audio/*" /></label>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="BGM 음량" />
      <audio id="bgm" loop></audio>
    </section>

    <div class="layout">
      <section class="hero" aria-label="쇼콜라와 듀크">
        <img class="chocola" src="https://is1-ssl.mzstatic.com/image/thumb/WnKu9_fae9MqUeQeMh3XVw/1200x675.jpg" alt="브이 포즈를 한 쇼콜라" />
        <div class="brand">SUGAR SUGAR RUNE<br>O₃ HEART CHECK</div>
        <div class="speech">오늘의 오존 하트,<br>체크해볼까? ♥</div>
        <div class="vheart" aria-hidden="true">♥</div>
        <img id="duke" class="duke" src="https://sugar-rune.com/wp-content/uploads/2015/12/duke-1.jpg" alt="듀크" />
        <p class="hero-note">작은 하트가 오늘의 하늘을 말해줘 ♥</p>
      </section>

      <section class="panel">
        <p class="mini-title">하늘의 하트가 말해주는 오늘의 오존 이야기…♥</p>

        <section class="input-card">
          <h1>오늘의 기온을 입력해줘!</h1>
          <div class="temp">
            <input id="temperature" type="number" min="-30" max="60" step="0.1" value="28" inputmode="decimal" aria-label="오늘의 기온" />
            <b>°C</b>
          </div>
          <button id="checkBtn" class="check" type="button">오존 하트 체크하기 ♥</button>
        </section>

        <section id="resultCard" class="result-card" aria-live="polite">
          <button id="closeResult" class="close" type="button" aria-label="결과 닫기">×</button>
          <div class="result-kicker">오늘의 오존 하트는…</div>
          <div id="resultHeart" class="result-heart" aria-hidden="true">♥</div>
          <div id="resultName" class="result-name">주의</div>
          <p id="resultText" class="result-text"></p>
          <p class="result-note">기온과 오존의 관계를 보여주는 연구 기반 시각화예요. 실제 외출 판단은 현재 대기질 측정값과 함께 확인해 주세요.</p>
        </section>

        <section class="legend" aria-label="오존 하트 단계">
          <p class="mini-title">♥ 하트로 보는 오존 단계 ♥</p>
          <div class="legend-grid">
            <div class="heart-item"><span class="gem" style="color:#f4dc3b">♥</span>낮음</div>
            <div class="heart-item"><span class="gem" style="color:#35ca63">♥</span>보통</div>
            <div class="heart-item"><span class="gem" style="color:#f08a24">♥</span>주의</div>
            <div class="heart-item"><span class="gem" style="color:#ef75ba">♥</span>높음</div>
            <div class="heart-item"><span class="gem" style="color:#9b4fe0">♥</span>매우 높음</div>
            <div class="heart-item"><span class="gem" style="color:#e63248">♥</span>매우 위험</div>
          </div>
        </section>
      </section>
    </div>

    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="sparkles" class="sparkles" aria-hidden="true"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
