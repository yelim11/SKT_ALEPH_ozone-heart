<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef8ab6">
<title>쇼콜라와 보는 오존도</title>
<meta name="description" content="2025년 서울 기온·오존 연구 결과를 실제로 사용하는 논문 기반 웹앱">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f9d9e8;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}body{display:flex;justify-content:center}.app{position:relative;width:min(100vw,1086px);aspect-ratio:3/4;background:#ffd8e8;overflow:hidden;box-shadow:0 0 40px rgba(126,26,70,.2)}.design{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}.temp{position:absolute;left:18.4%;top:33.13%;width:37.2%;height:3.65%;border:0;outline:0;background:rgba(255,255,255,.93);border-radius:1.1vw;padding:0 4.5% 0 3.5%;font-size:clamp(12px,2.2vw,24px);font-weight:700;color:#c72a67;box-shadow:none}.temp::placeholder{color:#aaa8bd}.analyze{position:absolute;left:58.4%;top:32.95%;width:22.5%;height:3.9%;border:0;background:transparent;cursor:pointer;border-radius:999px}.analyze:focus-visible{outline:3px solid #8a2be2;outline-offset:3px}.msg{position:absolute;left:17%;top:36.9%;width:66%;min-height:2.2%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(9px,1.45vw,16px);font-weight:800;color:#bd1b5f;pointer-events:none}.pill{position:absolute;left:76.7%;top:39.75%;width:17.7%;height:3.0%;display:flex;align-items:center;justify-content:center;background:rgba(255,246,251,.97);border:1px solid #f28fb7;border-radius:999px;color:#d52d70;font-weight:900;font-size:clamp(9px,1.35vw,15px);padding:0 4px}.qbox{position:absolute;left:19.2%;top:44.0%;width:27.5%;height:8.0%;background:rgba(255,255,255,.92);border-radius:1vw;padding:.45% .8%;display:flex;flex-direction:column;justify-content:center;color:#485172}.qtitle{font-size:clamp(10px,1.55vw,18px);font-weight:900;line-height:1.28;color:#f02a78;margin-bottom:.4em}.qline{font-size:clamp(8px,1.35vw,15px);line-height:1.36}.qmean{color:#ef2c78;font-weight:900}.range{margin-top:.22em;font-size:clamp(7px,1.05vw,12px);color:#7d6b80}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){.app{width:100vw}.temp{border-radius:8px;padding-left:13px;padding-right:24px}.qbox{border-radius:5px}}
</style>
</head>
<body>
<main class="app" aria-label="쇼콜라와 보는 오존도">
  <img class="design" src="assets/design.svg" alt="쇼콜라와 듀크가 함께하는 서울 오존 안내 앱 디자인">
  <label class="sr" for="temp">오늘의 일평균 기온</label>
  <input id="temp" class="temp" type="number" inputmode="decimal" step="0.1" value="25" placeholder="기온을 입력해주세요 (예: 25)" aria-describedby="msg">
  <button id="analyze" class="analyze" type="button" aria-label="논문 결과로 분석하기"></button>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="pill" class="pill">입력한 기온: 25°C</div>
  <div class="qbox" aria-live="polite">
    <div id="qtitle" class="qtitle">입력한 기온은 높은 기온 구간에 해당해요!</div>
    <div class="qline">이 구간의 평균 O₃ 자료값은 <span id="qmean" class="qmean">0.03600</span> 이었습니다.</div>
    <div id="range" class="range">논문 관측 구간: 23.05°C 초과 ~ 28.8°C</div>
  </div>
</main>
<script>
const input=document.getElementById('temp');
const btn=document.getElementById('analyze');
const msg=document.getElementById('msg');
const pill=document.getElementById('pill');
const qtitle=document.getElementById('qtitle');
const qmean=document.getElementById('qmean');
const range=document.getElementById('range');
const groups=[
 {max:14.35,title:'입력한 기온은 낮은 기온 구간에 해당해요!',mean:'0.03837',range:'논문 관측 구간: 4.5°C ~ 14.35°C'},
 {max:19.20,title:'입력한 기온은 중간 기온 구간(Q2)에 해당해요!',mean:'0.03687',range:'논문 관측 구간: 14.35°C 초과 ~ 19.20°C'},
 {max:23.05,title:'입력한 기온은 중간 기온 구간(Q3)에 해당해요!',mean:'0.04536',range:'논문 관측 구간: 19.20°C 초과 ~ 23.05°C'},
 {max:28.80,title:'입력한 기온은 높은 기온 구간에 해당해요!',mean:'0.03600',range:'논문 관측 구간: 23.05°C 초과 ~ 28.8°C'}
];
function analyze(){
 const t=Number(input.value);
 if(input.value.trim()===''||!Number.isFinite(t)){
   msg.textContent='기온을 숫자로 입력해 주세요.'; return;
 }
 if(t<4.5||t>28.8){
   msg.textContent='논문이 관측한 4.5°C~28.8°C 범위 밖입니다. 이 연구만으로는 해당 기온을 해석하지 않습니다.';
   pill.textContent=`입력한 기온: ${t.toFixed(1)}°C`;
   qtitle.textContent='논문 관측 범위 밖의 기온이에요.';
   qmean.textContent='해석 보류';
   range.textContent='연구 범위 안의 값을 입력하면 실제 논문 결과를 적용합니다.';
   return;
 }
 const g=groups.find(x=>t<=x.max);
 msg.textContent='';
 pill.textContent=`입력한 기온: ${Number.isInteger(t)?t:t.toFixed(1)}°C`;
 qtitle.textContent=g.title;
 qmean.textContent=g.mean;
 range.textContent=g.range;
}
btn.addEventListener('click',analyze);
input.addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
analyze();
</script>
</body>
</html>
