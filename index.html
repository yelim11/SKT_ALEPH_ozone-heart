<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f49abc">
<title>쇼콜라와 보는 오존도</title>
<meta name="description" content="2025년 서울 기온·오존 연구 결과를 실제로 사용하는 논문 기반 웹앱">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f8c4dc;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:#7b1e49}body{display:flex;justify-content:center}.stage{position:relative;width:min(100vw,1024px);aspect-ratio:1024/1365;overflow:hidden;background:#f7c0d9;box-shadow:0 0 50px rgba(117,21,65,.23)}.design{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}.temp-input{position:absolute;z-index:5;left:24.2%;top:35.18%;width:29.6%;height:2.95%;border:0;outline:0;border-radius:10px;background:rgba(255,255,255,.97);color:#82365c;font-weight:800;font-size:clamp(10px,1.75vw,18px);padding:0 8px;box-shadow:none}.temp-input::placeholder{color:#9fa0b0;font-weight:600}.analyze{position:absolute;z-index:6;left:61.6%;top:34.75%;width:23.9%;height:4.35%;border:0;border-radius:999px;background:transparent;cursor:pointer}.analyze:focus-visible{outline:3px solid #8d1b54;outline-offset:2px}.analyze:hover{background:rgba(255,255,255,.12);box-shadow:0 0 22px rgba(255,255,255,.8)}.result-pill{position:absolute;z-index:5;left:79.2%;top:42.45%;width:15.3%;height:2.65%;border-radius:999px;background:rgba(255,247,251,.98);display:flex;align-items:center;justify-content:center;color:#dc3272;font-weight:900;font-size:clamp(8px,1.22vw,13px);white-space:nowrap}.result-copy{position:absolute;z-index:5;left:19.8%;top:46.15%;width:30.4%;height:7.55%;padding:2px 4px;background:rgba(255,255,255,.965);display:flex;flex-direction:column;justify-content:center;color:#243960;font-size:clamp(8px,1.18vw,13px);line-height:1.42;border-radius:7px}.result-copy b{display:block;color:#f12369;font-size:clamp(9px,1.35vw,15px);line-height:1.3;margin-bottom:3px}.result-copy strong{color:#f12369;font-weight:900}.toast{position:absolute;z-index:20;left:50%;top:39.3%;transform:translate(-50%,-8px);max-width:72%;padding:9px 16px;border-radius:999px;background:rgba(100,23,60,.94);color:white;font-size:clamp(9px,1.28vw,14px);font-weight:800;opacity:0;pointer-events:none;transition:.18s ease;text-align:center;box-shadow:0 6px 20px rgba(94,21,58,.24)}.toast.show{opacity:1;transform:translate(-50%,0)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:560px){.stage{width:100vw}.temp-input{font-size:2.4vw;padding:0 4px}.result-pill{font-size:1.75vw}.result-copy{font-size:1.75vw}.result-copy b{font-size:2vw}.toast{font-size:2vw;padding:7px 10px}}
</style>
</head>
<body>
<main class="stage" aria-label="쇼콜라와 보는 오존도 앱">
  <img class="design" src="assets/design.webp" alt="쇼콜라와 듀크가 등장하는 핑크 하트 보석 디자인의 오존 분석 앱 화면">
  <label class="sr" for="temp">일평균 기온</label>
  <input id="temp" class="temp-input" type="number" step="0.1" inputmode="decimal" value="25" aria-label="기온 입력">
  <button id="analyze" class="analyze" type="button" aria-label="입력한 기온 분석하기"></button>
  <div id="pill" class="result-pill" aria-live="polite">입력한 기온: 25°C</div>
  <div id="resultCopy" class="result-copy" aria-live="polite">
    <b>입력한 기온은 높은 기온 구간에 해당해요!</b>
    <span>이 구간의 평균 O₃ 자료값은 <strong>0.03600</strong>이었습니다.</span>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script>
const input=document.getElementById('temp');
const btn=document.getElementById('analyze');
const pill=document.getElementById('pill');
const resultCopy=document.getElementById('resultCopy');
const toast=document.getElementById('toast');
const fallback={min:4.5,max:28.8,q:[14.9,18.9,23.05]};
const paperMeans=[0.0383652174,0.0368666667,0.0453619048,0.036];
let stats={...fallback};
function quantile(sorted,p){const pos=(sorted.length-1)*p,base=Math.floor(pos),rest=pos-base;return sorted[base+1]!==undefined?sorted[base]+rest*(sorted[base+1]-sorted[base]):sorted[base]}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function fmt(n,d=1){return Number(n).toFixed(d).replace(/\.0$/,'')}
function rangeText(i){const q=stats.q;if(i===0)return `${fmt(stats.min)}~${fmt(q[0])}°C`;if(i===1)return `${fmt(q[0])}~${fmt(q[1])}°C`;if(i===2)return `${fmt(q[1])}~${fmt(q[2])}°C`;return `${fmt(q[2])}~${fmt(stats.max)}°C`}
function analyze(){const raw=input.value.trim();if(raw===''){showToast('기온을 숫자로 입력해 주세요.');input.focus();return}const t=Number(raw);if(!Number.isFinite(t)){showToast('올바른 숫자를 입력해 주세요.');input.focus();return}pill.textContent=`입력한 기온: ${fmt(t)}°C`;if(t<stats.min||t>stats.max){resultCopy.innerHTML=`<b>논문 관측 범위 밖의 기온이에요.</b><span>연구 범위는 <strong>${fmt(stats.min)}~${fmt(stats.max)}°C</strong>였습니다. 범위 밖 값은 임의로 예측하지 않습니다.</span>`;showToast('논문 관측 범위 안의 값으로 다시 확인해 볼 수 있어요.');return}const q=stats.q;const i=t<=q[0]?0:t<=q[1]?1:t<=q[2]?2:3;const names=['낮은 기온 구간(Q1)','중간-낮은 기온 구간(Q2)','중간-높은 기온 구간(Q3)','높은 기온 구간(Q4)'];resultCopy.innerHTML=`<b>입력한 기온은 ${names[i]}에 해당해요!</b><span>${rangeText(i)} 구간의 평균 O₃ 자료값은 <strong>${paperMeans[i].toFixed(5)}</strong>이었습니다.</span>`}
async function loadData(){try{const r=await fetch('data/raw_seoul_2025_ozone_temperature.csv',{cache:'no-store'});if(!r.ok)throw new Error('data');const text=await r.text();const rows=text.trim().split(/\r?\n/);const head=rows[0].split(',');const ti=head.indexOf('temperature_avg');const vals=rows.slice(1).map(x=>Number(x.split(',')[ti])).filter(Number.isFinite).sort((a,b)=>a-b);if(vals.length){stats={min:vals[0],max:vals[vals.length-1],q:[quantile(vals,.25),quantile(vals,.5),quantile(vals,.75)]}}}catch(e){}analyze()}
btn.addEventListener('click',analyze);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();analyze()}});input.addEventListener('focus',()=>input.select());loadData();
</script>
</body>
</html>
